<!DOCTYPE html>
<html lang="en">
<head>
<!-- AUTH GUARD — must be the FIRST thing inside <head> -->
<style id="auth-guard-hide">html { visibility: hidden; }</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script>window.Auth.guardPage({ redirectTo: 'index.html' });</script>
<!-- END AUTH GUARD -->

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anant Avinya Technologies WORKSPACE</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #fafafa; color: #111; }
  .wrap { max-width: 760px; margin: 80px auto; padding: 40px; background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 14px; box-shadow: 0 18px 40px rgba(0,0,0,.05); }
  .logo { max-width: 280px; height: auto; margin-bottom: 28px; display: block; }
  h1 { margin: 0 0 14px; font-size: 32px; }
  p  { color: #555; line-height: 1.6; }
  button {
    margin-top: 24px;
    background: linear-gradient(135deg, #7CB342 0%, #558B2F 100%);
    color: #fff; border: 0; padding: 14px 22px; border-radius: 8px;
    font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 8px 20px rgba(85,139,47,.25);
    transition: filter .2s, transform .12s;
  }
  button:hover { filter: brightness(1.05); transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="aatech_logo_dark.png" alt="Anant Avinya Technologies" class="logo"/>
    <h1>You're in.</h1>
    <p>This is a placeholder for your real internal page. Replace this file with your actual <strong>WORKSPACE</strong> page — just make sure the AUTH GUARD block at the top of <code>&lt;head&gt;</code> stays in place.</p>
    <button id="signout-btn">Sign out</button>
  </div>
  <script>
    document.getElementById('signout-btn').addEventListener('click', async function () {
      await window.Auth.signOut();
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
